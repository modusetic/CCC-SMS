<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Scheduling — Initiate Request</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 28px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin: 20px 0 10px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"],
    select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 0.9rem;
      color: #111;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      pointer-events: none;
      font-size: 0.85rem;
    }

    .times-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .remove-btn:hover { color: #e53e3e; }

    .add-btn {
      background: none;
      border: 1px dashed #ccc;
      border-radius: 7px;
      color: #555;
      font-size: 0.85rem;
      padding: 8px 14px;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-btn:hover { border-color: #2563eb; color: #2563eb; }

    .hint {
      font-size: 0.78rem;
      color: #999;
      margin-top: 6px;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 24px 0;
    }

    .submit-btn {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 10px;
    }

    .submit-btn:hover { background: #1d4ed8; }
    .submit-btn:disabled { background: #93b4f5; cursor: not-allowed; }

    .toast {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .toast.success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    .toast.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

<div class="card">
  <h1>SMS Scheduling</h1>
  <p class="subtitle">Send an AI-powered scheduling request via SMS</p>

  <form id="scheduleForm">
    <div class="section-label">Contact</div>

    <div class="field">
      <label for="contactName">Name</label>
      <input type="text" id="contactName" placeholder="Jane Smith" required />
    </div>

    <div class="field">
      <label for="contactPhone">Phone number</label>
      <input type="tel" id="contactPhone" placeholder="+15551234567" required />
      <p class="hint">E.164 format — e.g. +15551234567</p>
    </div>

    <hr class="divider" />
    <div class="section-label">Organizer</div>

    <div class="field">
      <label for="organizerName">Name</label>
      <input type="text" id="organizerName" placeholder="Alex Johnson" required />
    </div>

    <div class="field">
      <label for="organizerEmail">Email</label>
      <input type="email" id="organizerEmail" placeholder="alex@example.com" required />
    </div>

    <hr class="divider" />
    <div class="section-label">Proposed Times</div>

    <div class="times-list" id="timesList"></div>

    <button type="button" class="add-btn" id="addBtn">+ Add time slot</button>

    <button type="submit" class="submit-btn" id="submitBtn">Send scheduling SMS</button>

    <div class="toast" id="toast"></div>
  </form>
</div>

<script>
  // ── Time options: 7:00 AM – 8:00 PM in 30-min increments ─────────────────
  const TIME_OPTIONS = (() => {
    const opts = [];
    for (let h = 7; h <= 20; h++) {
      for (const m of [0, 30]) {
        if (h === 20 && m === 30) break;
        const period = h < 12 ? 'AM' : 'PM';
        const h12 = h % 12 === 0 ? 12 : h % 12;
        const label = m === 0 ? `${h12}:00 ${period}` : `${h12}:30 ${period}`;
        const value = `${String(h).padStart(2,'0')}:${m === 0 ? '00' : '30'}`;
        opts.push({ label, value });
      }
    }
    return opts;
  })();

  function timeOptionsHTML(selectedValue) {
    return TIME_OPTIONS.map(o =>
      `<option value="${o.value}"${o.value === selectedValue ? ' selected' : ''}>${o.label}</option>`
    ).join('');
  }

  // Default date = today, default time = next upcoming 30-min slot
  function defaultDate() {
    return new Date().toISOString().split('T')[0];
  }

  function defaultTime() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes() < 30 ? 30 : 0;
    const hAdj = m === 0 ? h + 1 : h;
    if (hAdj > 20) return '09:00';
    return `${String(hAdj).padStart(2,'0')}:${m === 0 ? '00' : '30'}`;
  }

  function buildRow(date = defaultDate(), time = defaultTime()) {
    const row = document.createElement('div');
    row.className = 'time-row';
    row.innerHTML = `
      <input type="date" value="${date}" required />
      <div class="select-wrap">
        <select>${timeOptionsHTML(time)}</select>
      </div>
      <button type="button" class="remove-btn" title="Remove">×</button>
    `;
    row.querySelector('.remove-btn').addEventListener('click', () => removeRow(row));
    return row;
  }

  function removeRow(row) {
    if (document.getElementById('timesList').children.length === 1) return;
    row.remove();
  }

  function formatSlot(dateVal, timeVal) {
    // dateVal = "YYYY-MM-DD", timeVal = "HH:MM"
    // Parse as local date to avoid UTC offset shifting the day
    const [y, mo, d] = dateVal.split('-').map(Number);
    const [h, m] = timeVal.split(':').map(Number);
    const dt = new Date(y, mo - 1, d, h, m);
    const dayName  = dt.toLocaleDateString('en-US', { weekday: 'long' });
    const monthName = dt.toLocaleDateString('en-US', { month: 'long' });
    const day = dt.getDate();
    const period = h < 12 ? 'am' : 'pm';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    const minStr = m === 0 ? '' : `:${String(m).padStart(2,'0')}`;
    return `${dayName} ${monthName} ${day} at ${h12}${minStr}${period}`;
    // e.g. "Monday May 12 at 2pm" or "Tuesday May 13 at 10:30am"
  }

  // Init with one row
  document.getElementById('timesList').appendChild(buildRow());
  document.getElementById('addBtn').addEventListener('click', () => {
    document.getElementById('timesList').appendChild(buildRow());
  });

  // ── Submit ────────────────────────────────────────────────────────────────
  function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast ${type}`;
    toast.style.display = 'block';
  }

  document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const proposedTimes = Array.from(document.getElementById('timesList').children).map(row => {
      const date = row.querySelector('input[type="date"]').value;
      const time = row.querySelector('select').value;
      return formatSlot(date, time);
    });

    const payload = {
      contactName:    document.getElementById('contactName').value.trim(),
      contactPhone:   document.getElementById('contactPhone').value.trim(),
      organizerName:  document.getElementById('organizerName').value.trim(),
      organizerEmail: document.getElementById('organizerEmail').value.trim(),
      proposedTimes
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const res = await fetch('/api/initiate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        showToast(`SMS sent! Thread ID: ${data.threadId}`, 'success');
        e.target.reset();
        const list = document.getElementById('timesList');
        list.innerHTML = '';
        list.appendChild(buildRow());
      } else {
        showToast(data.error || 'Something went wrong. Please try again.', 'error');
      }
    } catch (err) {
      showToast('Could not reach the server. Check your connection.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send scheduling SMS';
    }
  });
</script>

</body>
</html>
